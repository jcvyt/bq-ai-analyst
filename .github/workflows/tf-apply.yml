name: tf-apply
on:
  push:
    branches: [main]
    paths:
      - "infra/envs/dev/**"
      - "infra/modules/**"
      - ".github/workflows/tf-*.yml"
      - "scripts/destroy_gate.sh"
      - "tests/access/**"
      - "requirements-dev.txt"
      - "sql/semantic/**"
      - "scripts/semantic_views.py"
      - ".github/workflows/tf-apply.yml"
      

permissions:
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: tf-apply-dev
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    env:
      TF_VAR_project_id:       ${{ vars.TF_VAR_PROJECT_ID }}
      TF_VAR_region:           ${{ vars.TF_VAR_REGION }}
      TF_VAR_admins_group:     ${{ secrets.TF_VAR_ADMINS_GROUP }}
      TF_VAR_developers_group: ${{ secrets.TF_VAR_DEVELOPERS_GROUP }}
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_SA }}
      - name: Mask identifiers
        env:
          TF_VAR_ADMINS_GROUP: ${{ secrets.TF_VAR_ADMINS_GROUP }}
          MASK_SELFTEST: ${{ vars.MASK_SELFTEST }}
        run: |
          set -euo pipefail
          PN="$(gcloud projects describe "${{ vars.TF_VAR_PROJECT_ID }}" --format='value(projectNumber)')"
          DOMAIN="${TF_VAR_ADMINS_GROUP#*@}"
          [[ -n "${PN:-}" && -n "${DOMAIN:-}" ]] || { echo "mask: empty lookup"; exit 1; }
          echo "::add-mask::${PN}"
          echo "::add-mask::${DOMAIN}"
          if [[ "${MASK_SELFTEST:-}" == "true" ]]; then echo "mask-selftest ${PN} ${DOMAIN}"; fi
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform init -input=false
      - run: terraform plan -input=false -lock-timeout=5m -parallelism=4 -out=tfplan
      - run: terraform show -json tfplan > tfplan.json
      - name: Labels of the merged PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                   --jq '(.[0].labels // []) | map(.name) | join(",")')
          if [[ ",${labels}," == *",allow-destroy,"* ]]; then a=true; else a=false; fi
          echo "allow_destroy=${a}" >> "$GITHUB_OUTPUT"
      - name: Destroy gate
        env:
          ALLOW_DESTROY: ${{ steps.pr.outputs.allow_destroy }}
        run: ../../../scripts/destroy_gate.sh tfplan.json
      - name: Plan summary
        run: |
          { echo "### dev plan (main)"; echo '```'; terraform show -no-color tfplan | tail -n 80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: infra/envs/dev/tfplan
          retention-days: 1

  apply:
    needs: plan
    runs-on: ubuntu-24.04
    environment: dev
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_SA }}
      - name: Mask identifiers
        env:
          TF_VAR_ADMINS_GROUP: ${{ secrets.TF_VAR_ADMINS_GROUP }}
          MASK_SELFTEST: ${{ vars.MASK_SELFTEST }}
        run: |
          set -euo pipefail
          PN="$(gcloud projects describe "${{ vars.TF_VAR_PROJECT_ID }}" --format='value(projectNumber)')"
          DOMAIN="${TF_VAR_ADMINS_GROUP#*@}"
          [[ -n "${PN:-}" && -n "${DOMAIN:-}" ]] || { echo "mask: empty lookup"; exit 1; }
          echo "::add-mask::${PN}"
          echo "::add-mask::${DOMAIN}"
          if [[ "${MASK_SELFTEST:-}" == "true" ]]; then echo "mask-selftest ${PN} ${DOMAIN}"; fi
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION }}
          terraform_wrapper: false
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: infra/envs/dev
      - name: Apply
        working-directory: infra/envs/dev
        run: |
          terraform init -input=false
          terraform apply -input=false -lock-timeout=5m -parallelism=4 tfplan
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install --quiet -r requirements-dev.txt
      - name: Reconcile semantic views (ADR-0002)     # ← inserted here
        run: python scripts/semantic_views.py reconcile
      - name: Access regression (as sa-analyst-agent)
        run: python tests/access/test_semantic_access.py
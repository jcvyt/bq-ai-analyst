version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      gha:
        patterns: ["*"]
  - package-ecosystem: "terraform"
    directory: "/infra/bootstrap"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "hashicorp/google*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "terraform"
    directory: "/infra/envs/dev"          # <-- the second directory
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "hashicorp/google*"
        update-types: ["version-update:semver-major"]
